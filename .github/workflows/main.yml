name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A9B6A2: ${{ secrets.A9B6A2 }}
          B551B4: ${{ secrets.B551B4 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A9B6A2', '')
          k2 = os.environ.get('B551B4', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- b9dffab399e9cfa28abdcf87e1 -->', k1) if k1 else txt
          out = out.replace('<!-- 4ce120a287c19029cfa09f626312727f -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
